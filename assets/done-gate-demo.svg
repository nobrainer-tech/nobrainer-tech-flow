<svg xmlns="http://www.w3.org/2000/svg" width="860" height="600" viewBox="0 0 860 600" role="img" aria-labelledby="title desc">
<title id="title">nobrainer-tech-flow done gate demo</title>
<desc id="desc">An agent says all tests pass. The Flow MCP server reads the test log, rejects the claim and answers NOT_DONE. After a real fix and a passing run it answers DONE.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:15.5px;fill:#151515}
.muted{fill:#5f5a52}.ink{fill:#151515}.prompt{fill:#2f55d4;font-weight:700}.cmd{fill:#2f55d4;font-weight:700}
.bad{fill:#b8380d;font-weight:700}.good{fill:#2f55d4;font-weight:700}
.cap{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12.5px;fill:#5f5a52}
.ttl{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13.5px;fill:#5f5a52;font-weight:600}
@keyframes l0{0%,4.40%{opacity:0}5.60%,97%{opacity:1}100%{opacity:0}}.l0{animation:l0 22.8s linear infinite}@keyframes l2{0%,10.55%{opacity:0}11.75%,97%{opacity:1}100%{opacity:0}}.l2{animation:l2 22.8s linear infinite}@keyframes l3{0%,13.41%{opacity:0}14.61%,97%{opacity:1}100%{opacity:0}}.l3{animation:l3 22.8s linear infinite}@keyframes l5{0%,19.56%{opacity:0}20.76%,97%{opacity:1}100%{opacity:0}}.l5{animation:l5 22.8s linear infinite}@keyframes l6{0%,21.54%{opacity:0}22.74%,97%{opacity:1}100%{opacity:0}}.l6{animation:l6 22.8s linear infinite}@keyframes l7{0%,23.52%{opacity:0}24.72%,97%{opacity:1}100%{opacity:0}}.l7{animation:l7 22.8s linear infinite}@keyframes l8{0%,27.47%{opacity:0}28.67%,97%{opacity:1}100%{opacity:0}}.l8{animation:l8 22.8s linear infinite}@keyframes l9{0%,30.33%{opacity:0}31.53%,97%{opacity:1}100%{opacity:0}}.l9{animation:l9 22.8s linear infinite}@keyframes l11{0%,36.48%{opacity:0}37.68%,97%{opacity:1}100%{opacity:0}}.l11{animation:l11 22.8s linear infinite}@keyframes l12{0%,40.44%{opacity:0}41.64%,97%{opacity:1}100%{opacity:0}}.l12{animation:l12 22.8s linear infinite}@keyframes l13{0%,43.30%{opacity:0}44.50%,97%{opacity:1}100%{opacity:0}}.l13{animation:l13 22.8s linear infinite}@keyframes l15{0%,49.45%{opacity:0}50.65%,97%{opacity:1}100%{opacity:0}}.l15{animation:l15 22.8s linear infinite}@keyframes l16{0%,55.16%{opacity:0}56.36%,97%{opacity:1}100%{opacity:0}}.l16{animation:l16 22.8s linear infinite}@keyframes l17{0%,59.12%{opacity:0}60.32%,97%{opacity:1}100%{opacity:0}}.l17{animation:l17 22.8s linear infinite}@keyframes l18{0%,64.84%{opacity:0}66.04%,97%{opacity:1}100%{opacity:0}}.l18{animation:l18 22.8s linear infinite}@keyframes l19{0%,68.79%{opacity:0}69.99%,97%{opacity:1}100%{opacity:0}}.l19{animation:l19 22.8s linear infinite}
@media (prefers-reduced-motion:reduce){text{animation:none!important;opacity:1!important}}
</style>
<rect x="1" y="1" width="858" height="598" rx="14" fill="#fbf8f3" stroke="#e3dccf" stroke-width="2"/>
<path d="M1 44H859" stroke="#e3dccf" stroke-width="2"/>
<circle cx="26" cy="23" r="6" fill="#f04a14"/><circle cx="46" cy="23" r="6" fill="#e3dccf"/><circle cx="66" cy="23" r="6" fill="#e3dccf"/>
<text class="ttl" x="450" y="28" text-anchor="middle">done gate · mcp.nobrainer.tech</text>
<text class="l0" x="28" y="75" xml:space="preserve"><tspan class="muted">agent  </tspan><tspan class="ink">Fixed the date parser. All tests pass. Done.</tspan></text>
<text class="l2" x="28" y="125" xml:space="preserve"><tspan class="prompt">&gt; </tspan><tspan class="cmd">start_flow_task</tspan><tspan class="muted"> DoD: &quot;new unit test passes&quot;</tspan></text>
<text class="l3" x="28" y="150" xml:space="preserve"><tspan class="muted">  path </tspan><tspan class="ink">QUICK</tspan><tspan class="muted">  AC01 </tspan><tspan class="ink">test, local</tspan><tspan class="muted">  next </tspan><tspan class="ink">DRIFT_CHECK</tspan></text>
<text class="l5" x="28" y="200" xml:space="preserve"><tspan class="prompt">&gt; </tspan><tspan class="cmd">check_flow_evidence</tspan><tspan class="muted"> AC01 pytest -q exit=0, log:</tspan></text>
<text class="l6" x="28" y="225" xml:space="preserve"><tspan class="muted">    FAILED tests/test_dates.py::test_feb_30</tspan></text>
<text class="l7" x="28" y="250" xml:space="preserve"><tspan class="muted">    ===== 1 failed, 4 passed in 0.21s =====</tspan></text>
<text class="l8" x="28" y="275" xml:space="preserve"><tspan class="muted">  AC01 </tspan><tspan class="bad">REJECTED</tspan><tspan class="muted">  EXIT_OUTPUT_CONFLICT</tspan></text>
<text class="l9" x="28" y="300" xml:space="preserve"><tspan class="muted">  exit 0 but a summary reports failed tests.</tspan></text>
<text class="l11" x="28" y="350" xml:space="preserve"><tspan class="prompt">&gt; </tspan><tspan class="cmd">check_flow_done</tspan></text>
<text class="l12" x="28" y="375" xml:space="preserve"><tspan class="bad">  NOT_DONE</tspan><tspan class="muted">  missing AC01</tspan></text>
<text class="l13" x="28" y="400" xml:space="preserve"><tspan class="muted">  needs test evidence, level local; the last record failed or was inconsistent</tspan></text>
<text class="l15" x="28" y="450" xml:space="preserve"><tspan class="muted">agent  </tspan><tspan class="ink">Fixed the leap-day check. Running the tests again.</tspan></text>
<text class="l16" x="28" y="475" xml:space="preserve"><tspan class="prompt">&gt; </tspan><tspan class="cmd">check_flow_evidence</tspan><tspan class="muted"> AC01 pytest -q: 5 passed</tspan></text>
<text class="l17" x="28" y="500" xml:space="preserve"><tspan class="muted">  AC01 </tspan><tspan class="good">ACCEPTED</tspan><tspan class="muted">  local  digest 13848f53</tspan></text>
<text class="l18" x="28" y="525" xml:space="preserve"><tspan class="prompt">&gt; </tspan><tspan class="cmd">check_flow_done</tspan></text>
<text class="l19" x="28" y="550" xml:space="preserve"><tspan class="good">  DONE</tspan><tspan class="muted">  receipt nbr1.&lt;receipt&gt;  next </tspan><tspan class="ink">draft_flow_handoff</tspan></text>
<text class="cap" x="28" y="584">&gt; lines: live calls to https://mcp.nobrainer.tech/mcp (server 1.0.0+flow.2.11.0, 2026-11-09), shortened. agent lines: the scenario.</text>
</svg>
