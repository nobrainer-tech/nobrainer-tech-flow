<svg xmlns="http://www.w3.org/2000/svg" width="500" height="743" viewBox="0 0 500 743" role="img" aria-labelledby="title desc">
<title id="title">nobrainer-tech-flow done gate demo</title>
<desc id="desc">An agent says all tests pass. The Flow MCP server reads the test log, rejects the claim and answers NOT_DONE. After a real fix and a passing run it answers DONE.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:15.5px;fill:#151515}
.muted{fill:#5f5a52}.ink{fill:#151515}.prompt{fill:#2f55d4;font-weight:700}.cmd{fill:#2f55d4;font-weight:700}
.bad{fill:#b8380d;font-weight:700}.good{fill:#2f55d4;font-weight:700}
.cap{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12.5px;fill:#5f5a52}
.ttl{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13.5px;fill:#5f5a52;font-weight:600}
@keyframes l0{0%,4.12%{opacity:0}5.32%,97%{opacity:1}100%{opacity:0}}.l0{animation:l0 24.2s linear infinite}@keyframes l1{0%,5.36%{opacity:0}6.56%,97%{opacity:1}100%{opacity:0}}.l1{animation:l1 24.2s linear infinite}@keyframes l3{0%,11.13%{opacity:0}12.33%,97%{opacity:1}100%{opacity:0}}.l3{animation:l3 24.2s linear infinite}@keyframes l4{0%,13.81%{opacity:0}15.01%,97%{opacity:1}100%{opacity:0}}.l4{animation:l4 24.2s linear infinite}@keyframes l6{0%,19.59%{opacity:0}20.79%,97%{opacity:1}100%{opacity:0}}.l6{animation:l6 24.2s linear infinite}@keyframes l7{0%,20.82%{opacity:0}22.02%,97%{opacity:1}100%{opacity:0}}.l7{animation:l7 24.2s linear infinite}@keyframes l8{0%,22.68%{opacity:0}23.88%,97%{opacity:1}100%{opacity:0}}.l8{animation:l8 24.2s linear infinite}@keyframes l9{0%,24.54%{opacity:0}25.74%,97%{opacity:1}100%{opacity:0}}.l9{animation:l9 24.2s linear infinite}@keyframes l10{0%,28.25%{opacity:0}29.45%,97%{opacity:1}100%{opacity:0}}.l10{animation:l10 24.2s linear infinite}@keyframes l11{0%,30.93%{opacity:0}32.13%,97%{opacity:1}100%{opacity:0}}.l11{animation:l11 24.2s linear infinite}@keyframes l13{0%,36.70%{opacity:0}37.90%,97%{opacity:1}100%{opacity:0}}.l13{animation:l13 24.2s linear infinite}@keyframes l14{0%,40.41%{opacity:0}41.61%,97%{opacity:1}100%{opacity:0}}.l14{animation:l14 24.2s linear infinite}@keyframes l15{0%,43.09%{opacity:0}44.29%,97%{opacity:1}100%{opacity:0}}.l15{animation:l15 24.2s linear infinite}@keyframes l16{0%,44.33%{opacity:0}45.53%,97%{opacity:1}100%{opacity:0}}.l16{animation:l16 24.2s linear infinite}@keyframes l18{0%,50.10%{opacity:0}51.30%,97%{opacity:1}100%{opacity:0}}.l18{animation:l18 24.2s linear infinite}@keyframes l19{0%,51.34%{opacity:0}52.54%,97%{opacity:1}100%{opacity:0}}.l19{animation:l19 24.2s linear infinite}@keyframes l20{0%,56.70%{opacity:0}57.90%,97%{opacity:1}100%{opacity:0}}.l20{animation:l20 24.2s linear infinite}@keyframes l21{0%,60.41%{opacity:0}61.61%,97%{opacity:1}100%{opacity:0}}.l21{animation:l21 24.2s linear infinite}@keyframes l22{0%,65.77%{opacity:0}66.97%,97%{opacity:1}100%{opacity:0}}.l22{animation:l22 24.2s linear infinite}@keyframes l23{0%,69.48%{opacity:0}70.68%,97%{opacity:1}100%{opacity:0}}.l23{animation:l23 24.2s linear infinite}@keyframes l24{0%,70.72%{opacity:0}71.92%,97%{opacity:1}100%{opacity:0}}.l24{animation:l24 24.2s linear infinite}
